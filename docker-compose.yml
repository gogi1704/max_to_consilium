version: "3.8"

services:
  consilium-max-bot:
    build:
      context: .
    container_name: consilium-max-bot
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 50s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - consilium_internal

networks:
  consilium_internal:
    external: true
    name: consilium-internal
